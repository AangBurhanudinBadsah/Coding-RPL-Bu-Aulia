<!DOCTYPE html>
<html>
    <head>
        <title>FORM kecil kecilan</title>
    </head>
    <body>
        <form>
            <table>
                <tr>
                    <td><label>Nama Siswa</label></td>
                    <td>:</td>
                    <td><input type="text" required placeholder="Masukkan Nama"></td>
                </tr>
                <tr>
                    <td><label>Nomer Handphone</label></td>
                    <td>:</td>
                    <td> <input type="number"><br></td>
                </tr>
            </table>

            <label>Email</label>
            <input type="email"><br>
            <label>Password</label>
            <input type="password"><br>
            <label>Alamat</label>
            <textarea></textarea><br>
            <label>Jenis Kelamin</label><br>
            <input type="radio" name="jeniskelamin">Laki-laki<br>
            <input type="radio" name="jeniskelamin">Perempuan<br>
            <label>Makanan Favorit</label>
            <input type="checkbox" name="makanan">Nasi Gorenk<br>
            <input type="checkbox" name="makanan">Soto Ayam<br>
            <input type="checkbox" name="makanan">Terang Bulan :3<br>
            <input type="checkbox" name="makanan">PECEL BU INA<br>
            <input type="checkbox" name="makanan">Bakso<br>
            <label>Tanggal Lahir</label>
            <input type="date"><br>
            <label>Jurusan</label>
            <select name="jurusan">
                <option value="">Pilih</option>
                <option value="TKJ">TKJ</option>
                <option value="rpl">RPL</option>
                <option value="pg">PG</option>
            </select>
            <label>Upload Foto Diri</label>
            <input type="file">

            <button type="submit">Submit</button>

        </form>
    </body>
</html>
